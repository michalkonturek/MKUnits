schema: spec-driven

context: |
  Tech stack: Swift 6.0, SPM, Swift Testing
  Domain: unit conversion library using Decimal arithmetic
  Architecture: Unit base class with subclass groups (MassUnit, LengthUnit, etc.),
    Quantity struct for arithmetic/conversion, fluent Int/Double extensions
  Conventions: public static let for unit constants, Decimal(string:) for fractional ratios,
    2-space indent, swift-format enforced, MIT license headers
  CI: GitHub Actions on macOS-15 + ubuntu-latest (swift-format lint, swift build, swift test)
  Platforms: iOS 16+, macOS 13+, tvOS 16+, watchOS 9+, visionOS 1+

rules:
  tasks:
    - Each task should target a single source file or test file
    - Include the file path in the task title
  design:
    - Note cross-platform considerations (Linux metatype comparison, watchOS Decimal issues)
